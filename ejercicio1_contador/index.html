<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio DOM - Contador de clics</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Contador de clics</h1>
  <p class="subtitle">Ejercicio básico de manipulación del DOM</p>

  <!-- Caja donde se muestra el número y cambia de color -->
  <div id="box">
    <span id="contador">0</span>
  </div>

  <div class="botones">
    <button id="btn-restar">-1</button>
    <button id="btn-reset">Reiniciar</button>
    <button id="btn-sumar">+1</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
